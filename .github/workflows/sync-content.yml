name: Sync content snapshots

on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed snapshots
        run: |
          git add -- src/data/github.json src/data/blog.json scripts/github-cache.json
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync content snapshots"
          git push
